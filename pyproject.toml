[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "companybot-canary-demo"
version = "1.0.0"
description = "A real LangChain + AWS Bedrock agent used as Canary's PR security-gate demo target."
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.34.0",
  "fastapi>=0.110.0",
  "langchain-core>=0.3.0",
  "langchain-aws>=0.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
companybot = "companybot.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/companybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

