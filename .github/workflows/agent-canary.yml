name: Agent Canary Security Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companyagent-preview:
    runs-on: ubuntu-latest
    # Railway creates a temporary PR environment from the repository's base
    # environment. Set RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID, and
    # RAILWAY_TOKEN as repository secrets/variables; the helper waits for the
    # preview domain before invoking Canary.
    steps:
      - uses: actions/checkout@v4
      - name: Resolve AWS candidate
        id: preview
        env:
          CANARY_TARGET_URL: ${{ vars.CANARY_TARGET_URL }}
          CANARY_HEALTH_URL: ${{ vars.CANARY_HEALTH_URL }}
          CANARY_CHAT_URL: ${{ vars.CANARY_CHAT_URL }}
        run: |
          set -euo pipefail
          domain="${CANARY_TARGET_URL:-}"
          test -n "$domain" || { echo "Set repository variable CANARY_TARGET_URL to the AWS candidate base URL." >&2; exit 1; }
          case "$domain" in http://*|https://*) ;; *) echo "Candidate URL must use HTTP(S)" >&2; exit 1;; esac
          health_url="${CANARY_HEALTH_URL:-${domain%/}/health}"
          chat_url="${CANARY_CHAT_URL:-${domain%/}/chat}"
          echo "url=$chat_url" >> "$GITHUB_OUTPUT"
          echo "health_url=$health_url" >> "$GITHUB_OUTPUT"
      - name: Run Agent Canary
        id: canary
        uses: aiyush-22-git/Canary-Cutc/action@backend
        with:
          api-url: ${{ secrets.CANARY_API_URL }}
          api-token: ${{ secrets.CANARY_PROJECT_TOKEN }}
          target-url: ${{ steps.preview.outputs.url }}
          baseline-url: ${{ vars.CANARY_BASELINE_URL }}
          target-verification-token: ${{ secrets.CANARY_TARGET_VERIFICATION_TOKEN }}
          environment: preview
      - name: Publish outputs
        if: always()
        run: |
          echo "Decision: ${{ steps.canary.outputs.decision }}"
          echo "Release: ${{ steps.canary.outputs.release-id }}"
