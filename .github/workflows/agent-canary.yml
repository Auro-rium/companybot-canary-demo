name: Agent Canary Security Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companyagent-preview:
    runs-on: ubuntu-latest
    # CompanyAgent is hosted on AWS. Canary reaches the candidate from its AWS
    # backend; the candidate port is intentionally restricted to that source.
    steps:
      - uses: actions/checkout@v4
      - name: Run Agent Canary
        id: canary
        uses: Auro-rium/canary/action@feature/cutc-2026-differential-gate
        with:
          api-url: ${{ secrets.CANARY_API_URL }}
          api-token: ${{ secrets.CANARY_PROJECT_TOKEN }}
          target-url: ${{ vars.CANARY_CHAT_URL }}
          baseline-url: ${{ vars.CANARY_BASELINE_URL }}
          target-verification-token: ${{ secrets.CANARY_TARGET_VERIFICATION_TOKEN }}
          environment: preview
      - name: Publish outputs
        if: always()
        run: |
          echo "Decision: ${{ steps.canary.outputs.decision }}"
          echo "Release: ${{ steps.canary.outputs.release-id }}"
